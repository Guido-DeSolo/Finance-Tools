[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "finance-tools-alpaca-data"
version = "1.0.0"
description = "Importable Alpaca market-data collection and SQLite storage tools"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
stream = ["websockets>=12"]

[tool.setuptools.packages.find]
include = ["alpaca_data*"]
